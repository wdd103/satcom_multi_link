[General]
network = SatcomNetwork
sim-time-limit = 600s
ned-path = ned
output-scalar-file = results/${configname}-${runnumber}.sca
output-vector-file = results/${configname}-${runnumber}.vec

*.controller.timelineFile = "../satcom_platform/examples/minimal_project/runs/20261118T020000Z-aabbccdd/omnet_link_timeline.csv"
*.controller.satelliteId = "SAT41918"
*.aircraft.sendEnabled = true
*.gateway.sendEnabled = true
*.aircraft.packetBytes = 1200
*.gateway.packetBytes = 1200
*.aircraft.sendInterval = 0.1s
*.gateway.sendInterval = 0.1s
*.aircraft.trafficStart = 0s
*.gateway.trafficStart = 0s
*.aircraft.trafficStop = 600s
*.gateway.trafficStop = 600s
*.satellite.queueCapacity = 100
